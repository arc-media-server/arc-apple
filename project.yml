# The Xcode project is generated from this file with XcodeGen (`xcodegen generate`); the
# generated Arc.xcodeproj isn't kept in git.
name: Arc
options:
  bundleIdPrefix: org.arcmediaserver
  deploymentTarget:
    tvOS: "18.0"
    iOS: "18.0"
  developmentLanguage: en
packages:
  ArcKit:
    path: ArcKit
  # mpv and FFmpeg, patched for Apple TV (Dolby Vision, HDR10+, frame pacing), as XCFrameworks.
  # GPL-3.0; pinned by commit (docs/plans/arc-engine.md).
  MPVKit:
    url: https://github.com/edde746/mpv-build
    revision: 6dbda06021b128b7adc30161bf7870977e575135
targets:
  ArcTV:
    type: application
    platform: tvOS
    sources:
      - path: ArcTV
    dependencies:
      - package: ArcKit
      - package: MPVKit
        product: MPVKit
      # The Top Shelf: Continue Watching on the Home Screen.
      - target: ArcTopShelf
    # Shared with the Top Shelf: the server's address (app group) and the token (Keychain).
    entitlements:
      path: ArcTV/ArcTV.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.arcmediaserver.apple
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.arcmediaserver.apple.shared
    info:
      path: ArcTV/Info.plist
      properties:
        # The Top Shelf's links: arcmediaserver://open/<id> and arcmediaserver://play/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: org.arcmediaserver.apple
            CFBundleURLSchemes:
              - arcmediaserver
        CFBundleDisplayName: Arc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Arc servers on a home network are usually plain http at an IP address or a local name.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Arc connects to your Arc server on your home network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arcmediaserver.apple.tv
        PRODUCT_NAME: Arc
        # The layered icon and Top Shelf images, from arc-media-server's docs/brand.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  # The Top Shelf extension: the profile's most recent Continue Watching titles.
  ArcTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: ArcTopShelf
      - path: ArcTV/Shared
    dependencies:
      - package: ArcKit
      - sdk: TVServices.framework
    entitlements:
      path: ArcTopShelf/ArcTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.arcmediaserver.apple
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.arcmediaserver.apple.shared
    info:
      path: ArcTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Arc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arcmediaserver.apple.tv.topshelf
        PRODUCT_NAME: ArcTopShelf
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  # Walks the app in the simulator against the stand-in Arc and keeps screenshots (UITests/).
  ArcTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests/ArcTVUITests
    dependencies:
      - target: ArcTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arcmediaserver.apple.tv.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: ArcTV
        GENERATE_INFOPLIST_FILE: YES
  # iPhone and iPad: their own screens (ArcMobile/), sharing the Apple TV's player, Arc's
  # sign-in and data, the title actions and the text (each shared file is listed).
  ArcMobile:
    type: application
    platform: iOS
    sources:
      - path: ArcMobile
      - path: ArcTV/App/AppModel.swift
      - path: ArcTV/App/Theme.swift
      - path: ArcTV/App/LocalNetwork.swift
      - path: ArcTV/Shared
      - path: ArcTV/Models
      - path: ArcTV/Components/Artwork.swift
      - path: ArcTV/Components/TitleActions.swift
      - path: ArcTV/Components/Brand.swift
      - path: ArcTV/Player/PlayerText.swift
      - path: ArcTV/Player/PlaybackEngine.swift
      - path: ArcTV/Player/AVPlayerEngine.swift
      - path: ArcTV/Player/MPVEngine.swift
      - path: ArcTV/Player/MPVLinkShim.c
      - path: ArcTV/Player/DeviceCaps.swift
      - path: ArcTV/Player/NowPlaying.swift
      - path: ArcTV/Player/PlayerModel.swift
      - path: ArcTV/Together/WatchTogetherModel.swift
      - path: ArcTV/Resources/en.lproj
    dependencies:
      - package: ArcKit
      - package: MPVKit
        product: MPVKit
    entitlements:
      path: ArcMobile/ArcMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.arcmediaserver.apple
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.arcmediaserver.apple.shared
    info:
      path: ArcMobile/Info.plist
      properties:
        CFBundleDisplayName: Arc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: org.arcmediaserver.apple
            CFBundleURLSchemes:
              - arcmediaserver
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Sound keeps playing with the screen locked or in another app.
        UIBackgroundModes:
          - audio
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Arc connects to your Arc server on your home network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arcmediaserver.apple
        PRODUCT_NAME: Arc
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  # Walks the iPhone app in the simulator against the stand-in Arc and keeps screenshots.
  ArcMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/ArcMobileUITests
    dependencies:
      - target: ArcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arcmediaserver.apple.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: ArcMobile
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ArcTV:
    build:
      targets:
        ArcTV: all
    test:
      targets:
        - ArcTVUITests
      environmentVariables:
        ARC_STANDIN_URL: http://127.0.0.1:8080
  ArcMobile:
    build:
      targets:
        ArcMobile: all
    test:
      targets:
        - ArcMobileUITests
      environmentVariables:
        ARC_STANDIN_URL: http://127.0.0.1:8080
