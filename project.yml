# The Xcode project is generated from this file with XcodeGen (`xcodegen generate`); the
# generated Arc.xcodeproj isn't kept in git.
name: Arc
options:
  bundleIdPrefix: org.arcmediaserver
  deploymentTarget:
    tvOS: "17.0"
  developmentLanguage: en
packages:
  ArcKit:
    path: ArcKit
targets:
  ArcTV:
    type: application
    platform: tvOS
    sources:
      - path: ArcTV
    dependencies:
      - package: ArcKit
    info:
      path: ArcTV/Info.plist
      properties:
        CFBundleDisplayName: Arc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Arc servers on a home network are usually plain http at an IP address or a local name.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Arc connects to your Arc server on your home network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arcmediaserver.apple.tv
        PRODUCT_NAME: Arc
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  ArcTV:
    build:
      targets:
        ArcTV: all
