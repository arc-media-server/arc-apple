# Builds ArcKit (with its tests), the tvOS app and the iPhone/iPad app on macOS, then walks each
# in its simulator (Apple TV 4K, then an iPhone) against a stand-in Arc (UITests/) and keeps a
# screenshot of each screen as the "screenshots" artifact. It runs only when asked (the repository is public, so runs are free, but
# a run takes a while): from the Actions tab, or for a push to an agent's branch whose commit
# message contains [build]. Pushes that only change Markdown never run it, and a
# newer run on the same branch cancels an older one.
name: Build

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "codex/**"]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          # The newest Xcode on the runner (Xcode 26 has the tvOS 26 SDK, so Liquid Glass).
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: ArcKit tests
        run: swift test --package-path ArcKit
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build the Apple TV app
        id: tvbuild
        run: |
          set -o pipefail
          xcodebuild -project Arc.xcodeproj -scheme ArcTV -configuration Debug \
            -destination 'generic/platform=tvOS' CODE_SIGNING_ALLOWED=NO -quiet build
          # What the app weighs (a Debug build, so larger than a release), kept with the screenshots.
          du -sh ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-appletvos/Arc.app | tee app-size.txt
          du -sh ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-appletvos/Arc.app/Frameworks 2>/dev/null | tee -a app-size.txt || true
      - name: Package the Apple TV simulator app
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/arc-tvos-simulator"
          xcodebuild -project Arc.xcodeproj -scheme ArcTV -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath "$BUILD_DIR" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO -quiet build
          APP="$BUILD_DIR/Build/Products/Debug-appletvsimulator/Arc.app"
          xcrun lipo "$APP/Arc" -verify_arch arm64
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Arc-tvos-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: arc-tvos-simulator
          path: ${{ runner.temp }}/Arc-tvos-simulator.zip
          if-no-files-found: error
      - name: Start the stand-in Arc
        if: ${{ !cancelled() }}
        env:
          # Optional: real posters, backgrounds, logos and cast photos from TMDB for the screenshots.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 UITests/StandIn/serve.py 8080 > standin.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8080/api/v1/health
      - name: Walk the app in the simulator
        if: ${{ !cancelled() && steps.tvbuild.outcome == 'success' }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          tv = [(r, x) for r, xs in d.items() if "tvOS" in r for x in xs if "4K" in x["name"]]
          tv.sort(key=lambda p: p[0])
          print(tv[-1][1]["udid"])')
          echo "simulator: $DEVICE"
          xcodebuild -project Arc.xcodeproj -scheme ArcTV -destination "id=$DEVICE" \
            -resultBundlePath walk.xcresult -quiet test
      # The iPhone and iPad app: built and walked even when the Apple TV's steps failed, so
      # each platform's problems show on their own.
      - name: Build the iPhone and iPad app
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project Arc.xcodeproj -scheme ArcMobile -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet build
          du -sh ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphoneos/Arc.app | sed 's/^/iOS: /' | tee -a app-size.txt
      - name: Walk the iPhone app in the simulator
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ph = [(r, x) for r, xs in d.items() if "iOS" in r for x in xs
                if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
          ph.sort(key=lambda p: (p[0], p[1]["name"]))
          print(ph[-1][1]["udid"])')
          echo "simulator: $DEVICE"
          xcodebuild -project Arc.xcodeproj -scheme ArcMobile -destination "id=$DEVICE" \
            -resultBundlePath walk-iphone.xcresult -quiet test
      - name: Export the screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d walk.xcresult ]; then
            xcrun xcresulttool export attachments --path walk.xcresult --output-path screenshots || true
          fi
          if [ -d walk-iphone.xcresult ]; then
            mkdir -p screenshots/iphone
            xcrun xcresulttool export attachments --path walk-iphone.xcresult --output-path screenshots/iphone || true
          fi
          cp standin.log screenshots/ 2>/dev/null || true
          # The app's crash reports from the simulator, if it crashed.
          find ~/Library/Logs/DiagnosticReports -name 'Arc*' -newer standin.log -exec cp {} screenshots/ \; 2>/dev/null || true
          ls screenshots
      # JPEG copies (1280 wide, the size READMEs use) on the ci-screenshots branch (runs/<run id>/), so agents whose network
      # can't reach artifact storage can read them with git. Only ever appended to, never rewritten.
      - name: Share the screenshots on the ci-screenshots branch
        if: always()
        run: |
          set -e
          mkdir -p small
          python3 - <<'PY'
          import json, os, shutil
          # The Apple TV's walk, then the iPhone's (its names start with "m").
          for folder, prefix in (("screenshots", ""), ("screenshots/iphone", "iphone-")):
              path = os.path.join(folder, "manifest.json")
              m = json.load(open(path)) if os.path.exists(path) else []
              for test in m:
                  for i, a in enumerate(test.get("attachments", [])):
                      name = a.get("suggestedHumanReadableName", a["exportedFileName"]).split("_")[0]
                      ext = os.path.splitext(a["exportedFileName"])[1].lower()
                      # Screenshots become small JPEGs; text (failure details) is kept; recordings are left out.
                      if ext == ".png":
                          shutil.copy(os.path.join(folder, a["exportedFileName"]), os.path.join("small", name + ".png"))
                      elif ext == ".txt":
                          shutil.copy(os.path.join(folder, a["exportedFileName"]), os.path.join("small", f"{prefix}{name}-{i}.txt"))
          PY
          for f in small/*.png; do [ -e "$f" ] || continue; sips -s format jpeg -s formatOptions 80 -Z 1280 "$f" --out "${f%.png}.jpg" >/dev/null || true; rm "$f"; done
          cp standin.log small/ 2>/dev/null || true
          cp screenshots/*.ips small/ 2>/dev/null || true
          cp app-size.txt small/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="runs/${{ github.run_id }}"
          if git fetch --depth 1 origin ci-screenshots 2>/dev/null; then
            git worktree add shots-branch FETCH_HEAD
            git -C shots-branch checkout -b ci-screenshots
          else
            git worktree add --detach shots-branch
            git -C shots-branch checkout --orphan ci-screenshots
            git -C shots-branch rm -rfq .
          fi
          mkdir -p "shots-branch/$dir"
          # Always leave a note, so a run that never reached the simulator (a build error) shows too.
          ls small/*.jpg >/dev/null 2>&1 || echo "No screenshots: the build or the walk-through didn't start. See the run's log." > small/no-screenshots.txt
          cp small/* "shots-branch/$dir/"
          git -C shots-branch add runs
          git -C shots-branch commit -qm "Screenshots for run ${{ github.run_id }} (${{ github.sha }})"
          git -C shots-branch push origin ci-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 7
