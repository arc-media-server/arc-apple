# Builds ArcKit (with its tests) and the tvOS app on macOS. To save Actions minutes (macOS
# minutes count ten times on a private repository) it runs only when asked: from the Actions
# tab, or for a push to an agent's branch whose commit message contains [build].
name: Build

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "codex/**"]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: ArcKit tests
        run: swift test --package-path ArcKit
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build the Apple TV app
        run: |
          set -o pipefail
          xcodebuild -project Arc.xcodeproj -scheme ArcTV -configuration Debug \
            -destination 'generic/platform=tvOS' CODE_SIGNING_ALLOWED=NO -quiet build
